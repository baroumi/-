<!DOCTYPE html><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ملامحك تتحدث عنك</title>
<style>
body{margin:0;font-family:Arial;background:#101827;color:white;text-align:center}
.box{max-width:500px;margin:auto;padding:30px 20px}
h1{font-size:30px;margin-bottom:10px}
p{color:#cbd5e1}
.scan{border:2px solid #38bdf8;border-radius:20px;padding:25px;margin-top:25px}
button{background:#38bdf8;color:#07111f;border:0;border-radius:12px;padding:14px 25px;font-size:18px;font-weight:bold;margin:10px;cursor:pointer}
#preview{max-width:100%;max-height:300px;border-radius:15px;margin-top:15px;display:none}
#result{margin-top:20px;font-size:18px;line-height:1.8}
</style>
</head>

<body>
<div class="box">
<h1>🔎 ملامحك تتحدث عنك</h1>
<p>اكتشف قراءة ترفيهية لملامح الوجه</p>

<div class="scan">
<button onclick="document.getElementById('photo').click()">📷 اختر صورة</button>
<input id="photo" type="file" accept="image/*" style="display:none">

<img id="preview">

<button onclick="analyze()">✨ تحليل الصورة</button>

<div id="result"></div>
</div>
</div>

<script>
const photo=document.getElementById("photo");
const preview=document.getElementById("preview");

photo.onchange=function(){
 if(photo.files.length){
   preview.src=URL.createObjectURL(photo.files[0]);
   preview.style.display="block";
   document.getElementById("result").innerHTML="";
 }
};

function analyze(){
 if(!photo.files.length){
   document.getElementById("result").innerHTML="📷 اختار صورة أولاً";
   return;
 }
 document.getElementById("result").innerHTML=
 "🔍 جاري التحليل...<br><br>"+
 "✨ هذه قراءة ترفيهية فقط وليست حكماً علمياً على الشخصية.";
 setTimeout(function(){
 document.getElementById("result").innerHTML=
 "🧠 النتيجة الترفيهية<br><br>"+
 "يبدو أنك شخص يهتم بالتفاصيل، وتحب معرفة ما حولك، "+
 "وعندك فضول لاكتشاف شخصيات الآخرين. 😊<br><br>"+
 "⚠️ هذه النتيجة للترفيه فقط.";
 },1500);
}
</script>
</body>
</html>
